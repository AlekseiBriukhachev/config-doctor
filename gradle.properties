# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.aleksei
pluginName = config_doctor
pluginRepositoryUrl = https://github.com/AlekseiBriukhachev/config-doctor
# SemVer format -> https://semver.org
pluginVersion = 1.0.0

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 233
#pluginUntilBuild = 251.*

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
# platformType is passed to intellijPlatform.create(type, version) in build.gradle.kts (IC, IU, ...).
platformType = IC
platformVersion = 2023.3

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Comma-separated, e.g.: platformPlugins = com.intellij.java, org.jetbrains.plugins.yaml
platformPlugins =

# Gradle Releases -> https://github.com/gradle/gradle/releases
# Actual version is pinned in gradle/wrapper/gradle-wrapper.properties.
# Deliberately kept at 9.0.0 rather than bumped to the latest 9.7.1: 9.0.0
# was already downloaded/cached and proven working in the network this was
# developed behind (a corporate proxy that throttles/stalls large HTTPS
# downloads), while switching to 9.7.1 would force an entirely new ~200 MB
# distribution download with no guarantee of succeeding on the same network,
# for a same-major-version (9.x) change that carries no functional benefit
# for this project. Both versions are "current" in the sense of being
# actively supported Gradle 9.x releases - re-evaluate this trade-off with a
# working, unrestricted network.
gradleVersion = 9.0.0

# Version of the IntelliJ Platform Gradle Plugin itself (org.jetbrains.intellij.platform),
# pinned directly in the plugins {} block of build.gradle.kts: 2.18.1 (latest
# available release as of this update - verified against the plugin's Maven
# metadata).
# Migrated from the legacy 1.x (org.jetbrains.intellij) plugin, which is no longer developed.

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
# Note: verify this still works cleanly after the 2.x migration - some 2.x
# tasks have had configuration-cache caveats; if `./gradlew build` fails with
# a configuration-cache error, set this to false first to isolate the cause.
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Longer HTTP timeouts and more download retries -> some corporate networks route
# plugin/dependency downloads through a slow inspecting proxy (observed here as
# a Cisco WSA, "Via: ... Cisco-WSA" response header) that can throttle large
# JAR downloads. These only take effect when set here (systemProp.* is
# explicitly forwarded to the Gradle daemon JVM) - passing e.g.
# -Dhttp.socketTimeout on the command line does NOT reach the daemon and has
# no effect. NOTE: in the environment these were diagnosed in, even a 10
# minute timeout did not make the affected download succeed - the proxy
# appears to actively reset/stall the connection rather than just being slow,
# so this alone is not a guaranteed fix for that specific network. It is kept
# because it is a safe, standard Gradle setting that helps genuinely slow (but
# not actively broken) networks.
systemProp.http.socketTimeout = 300000
systemProp.http.connectionTimeout = 300000
systemProp.https.socketTimeout = 300000
systemProp.https.connectionTimeout = 300000
systemProp.org.gradle.internal.repository.max.tentatives = 5
systemProp.org.gradle.internal.repository.initial.backoff = 1000
